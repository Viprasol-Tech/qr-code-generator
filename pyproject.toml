[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qr-code-generator"
version = "0.1.0"
description = "QR code generator — real byte-mode QR encoding to a module matrix, rendered as text/PNG — by Viprasol Tech."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = [
  "qr-code",
  "qr-code-generator",
  "qrcode",
  "encoding",
  "python",
  "barcode",
  "utility",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
]
dependencies = ["pydantic>=2.13.4", "typer>=0.26.7", "rich>=15.0.0"]

[project.optional-dependencies]
dev = ["ruff>=0.15.16", "mypy>=2.1.0", "pytest>=9.0.3", "pytest-cov>=7.1.0"]

[project.scripts]
qr-code-generator = "qr_code_generator.cli:app"

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/qr-code-generator"
Issues = "https://github.com/Viprasol-Tech/qr-code-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qr_code_generator"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = ["B008", "B027", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
